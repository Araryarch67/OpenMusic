# Builds OpenMusic for Android, Windows and Linux and attaches the files to a
# GitHub release. Runs when a version tag is pushed (`git tag v1.2.0 && git
# push origin v1.2.0`), or by hand from the Actions tab (then the files are
# only kept as workflow artifacts, no release is made).
#
# Android signing: add these repository secrets so every release is signed with
# the same key (otherwise phones refuse to update over an earlier version):
#   ANDROID_KEYSTORE_BASE64   base64 of the .jks file
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Without them the APK is signed with a throwaway debug key.
#
# iOS / macOS: not built yet.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read-only by default: the build jobs run third-party build tools and need
# nothing more. Only the job that publishes the release may write.
permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  android:
    runs-on: ubuntu-24.04
    env:
      KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Version from the tag
        shell: bash
        run: echo "BUILD_ARGS=$(tool/ci_version.sh)" >> "$GITHUB_ENV"
      - name: Release key
        if: env.KEYSTORE != ''
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # One versionCode for every APK (Flutter adds 1000-4000 per ABI by default): a phone
        # can then move between the universal and per-ABI APKs without "can't downgrade".
        run: |
          flutter build apk --release $BUILD_ARGS
          flutter build apk --release --split-per-abi -P force-version-code-ignoring-abi=true $BUILD_ARGS
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/OpenMusic-android.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/OpenMusic-android-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/OpenMusic-android-arm32.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/OpenMusic-android-x86_64.apk
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Version from the tag
        shell: bash
        run: echo "BUILD_ARGS=$(tool/ci_version.sh)" >> "$GITHUB_ENV"
      - name: Build
        shell: bash
        run: flutter build windows --release $BUILD_ARGS
      - name: Visual C++ runtime next to the exe
        # So it starts on PCs without the redistributable installed.
        shell: pwsh
        run: |
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$dll" build/windows/x64/runner/Release/
          }
      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/OpenMusic-windows-x64.zip
      - name: Installer
        shell: bash
        run: |
          choco install innosetup --no-progress -y > /dev/null
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" -Q "-DAppVersion=$(tool/ci_app_version.sh)" \
            "-DSourceDir=$PWD/build/windows/x64/runner/Release" "-DOutputDir=$PWD/dist" windows/installer/openmusic.iss
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build tools and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev libwebkit2gtk-4.1-dev
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Version from the tag
        run: echo "BUILD_ARGS=$(tool/ci_version.sh)" >> "$GITHUB_ENV"
      - name: Build
        run: flutter build linux --release $BUILD_ARGS
      - name: Archive
        run: |
          mkdir -p dist
          tar -C build/linux/x64/release -czf dist/OpenMusic-linux-x64.tar.gz --transform 's,^bundle,OpenMusic,' bundle
      - name: .deb
        run: linux/packaging/build_deb.sh "$(tool/ci_app_version.sh)" dist/OpenMusic-linux-amd64.deb
      - name: AppImage
        run: linux/packaging/build_appimage.sh dist/OpenMusic-linux-x86_64.AppImage
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ### Which file?

            **Android** (7.0 and later, up to Android 16): take **OpenMusic-android.apk**; it runs on every phone.
            The smaller ones are for one kind of processor only: `arm64` fits almost every phone from the last
            years; `arm32` only old 32-bit phones (newer phones refuse it as "not compatible"); `x86_64` is for
            emulators and Chromebooks.

            **Windows**: `OpenMusic-windows-x64-setup.exe` installs it; the `.zip` runs without installing.
            **Linux**: the `.AppImage` runs anywhere; `.deb` for Debian / Ubuntu; `.tar.gz` is the plain bundle.
